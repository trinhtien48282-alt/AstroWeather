      <stop stop-color="#07111F"/>
      <stop offset=".55" stop-color="#0B1D32"/>
      <stop offset="1" stop-color="#102C43"/>
    </linearGradient>
    <linearGradient id="moon" x1="70" y1="65" x2="155" y2="165" gradientUnits="userSpaceOnUse">
